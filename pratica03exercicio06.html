<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03 - Juros Compostos</title>
    <link rel="stylesheet" href="pratica03exercicio06.css">
</head>

<body>
    <div class="container">
        <h2>Cálculo de Juros Compostos</h2>

        <label for="capital">Capital Inicial (C):</label>
        <input type="number" id="capital" step="any" placeholder="Ex: 1000">

        <label for="taxa">Taxa de Juros em % (i):</label>
        <input type="number" id="taxa" step="any" placeholder="Ex: 5 (para 5%)">

        <label for="tempo">Prazo / Tempo (t):</label>
        <input type="number" id="tempo" step="any" placeholder="Ex: 12">

        <button onclick="calcularMontante()">Calcular Montante</button>

        <div id="resultado"></div>
    </div>

    <script src="pratica03exercicio06.js"></script>
</body>
